<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("aurora_theme_v2")||"light";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.background = t==="light" ? "#f6f7fb" : "#02050f";document.documentElement.style.colorScheme = t==="light" ? "light" : "dark";}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Aurora — Choose a new password</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/aurora-app.css" id="aurora-app-css"><script>(function(){var l=document.getElementById("aurora-app-css");if(l)l.disabled=document.documentElement.getAttribute("data-theme")!=="light"})()</script><link rel="stylesheet" href="css/aurora-shared.css">
</head>
<body>
<canvas id="aurora-canvas"></canvas>
<nav class="navbar"><a href="index.html" class="nav-logo">✦ AURORA</a></nav>
<div class="auth-page"><div class="auth-container">
  <div class="auth-logo"><div class="auth-logo-text">✦ AURORA</div><div class="auth-logo-sub">Choose a new password</div></div>
  <div class="auth-card">
    <div id="state-wait" class="form-hint">Checking your link…</div>
    <div id="state-bad" style="display:none">
      <div style="font-weight:700;margin-bottom:6px">This link isn't valid anymore</div>
      <div class="form-hint" style="margin-bottom:14px">Reset links work once and expire quickly. Request a fresh one.</div>
      <a class="btn-full" href="auth.html" style="display:block;text-align:center;text-decoration:none">Back to sign in</a>
    </div>
    <form id="state-form" style="display:none" onsubmit="savePw(event)">
      <div class="form-group"><label class="form-label">New password</label>
        <input class="form-input" id="pw1" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></div>
      <div class="form-group"><label class="form-label">Repeat new password</label>
        <input class="form-input" id="pw2" type="password" minlength="8" required autocomplete="new-password"></div>
      <div id="pw-err" class="form-hint" style="color:#ff6b6b;display:none;margin-bottom:10px"></div>
      <button class="btn-full" type="submit" id="pw-btn">Save new password</button>
    </form>
    <div id="state-done" style="display:none">
      <div style="font-weight:700;margin-bottom:6px">✓ Password updated</div>
      <div class="form-hint">Taking you to your account…</div>
    </div>
  </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/aurora-bg.js"></script>
<script>
const show = (id) => ['wait','bad','form','done'].forEach(k => document.getElementById('state-'+k).style.display = k===id ? '' : 'none');
let ready = false;
// The emailed link carries a one-time recovery token. The Supabase library
// exchanges it for a short-lived session and fires PASSWORD_RECOVERY.
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { ready = true; show('form'); history.replaceState(null, '', location.pathname); }
});
setTimeout(async () => {
  if (ready) return;
  const hasError = /error(_code|_description)?=/.test(location.hash + location.search);
  const { data } = await supabaseClient.auth.getSession();
  // A session without a recovery event could be an ordinary logged-in visit — don't allow
  // password change here without the emailed link.
  if (!ready) show('bad');
}, 2500);
async function savePw(e) {
  e.preventDefault();
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  const err = document.getElementById('pw-err'); err.style.display = 'none';
  if (a.length < 8) { err.textContent = 'Use at least 8 characters.'; err.style.display = 'block'; return; }
  if (a !== b) { err.textContent = "The passwords don't match."; err.style.display = 'block'; return; }
  const btn = document.getElementById('pw-btn'); btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await supabaseClient.auth.updateUser({ password: a });
  if (error) {
    err.textContent = /same|different/i.test(error.message) ? 'Choose a password you have not used before.' : (/weak|short|least/i.test(error.message) ? error.message : 'Could not update the password. Request a new link and try again.');
    err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Save new password'; return;
  }
  // Kill every other logged-in device: a reset usually means "someone else might have it".
  try { await supabaseClient.auth.signOut({ scope: 'others' }); } catch {}
  show('done');
  try { const u = await AuroraAuth.refresh(); setTimeout(() => location.replace(u && u.role === 'seller' ? 'seller.html' : 'buyer.html'), 1200); }
  catch { setTimeout(() => location.replace('auth.html'), 1200); }
}
</script>
</body>
</html>
