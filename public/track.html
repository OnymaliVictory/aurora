<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("aurora_theme")||"dark";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.background = t==="light" ? "#f6f7fb" : "#02050f";document.documentElement.style.colorScheme = t==="light" ? "light" : "dark";}catch(e){}})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aurora — Track Order</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-no-bot>
<canvas id="aurora-canvas"></canvas>
<nav class="navbar">
  <a href="index.html" class="nav-logo">✦ AURORA</a>
  <div class="nav-links" id="nav-links">
    <a href="buyer.html" class="nav-link">Explore Shops</a>
  </div>
  <button class="theme-toggle" title="Toggle theme">☀️</button>
</nav>

<div style="max-width:520px;margin:110px auto 60px;padding:0 16px">
  <div class="glass-card" style="padding:26px">
    <h2 style="font-family:'Cinzel Decorative',serif;font-size:24px;margin-bottom:6px">Track your order</h2>
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:16px">Enter the tracking ID from your receipt or email. No account needed.</p>
    <form class="atk-form" id="track-form">
      <input id="track-input" placeholder="AUR-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="20" aria-label="Tracking ID">
      <button type="submit">Track</button>
    </form>
    <div id="track-result"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/aurora-bg.js"></script>
<script>
// app.js loads track-bot.js dynamically, so wait until it has defined AuroraTrack.
function startTrackPage() {
  if (!window.AuroraTrack) { setTimeout(startTrackPage, 50); return; }
  AuroraTrack.injectStyles();
  const form = document.getElementById('track-form');
  const input = document.getElementById('track-input');
  const result = document.getElementById('track-result');
  AuroraTrack.bindLookup(form, input, result);

  // Links from emails look like track.html?id=AUR-7K4M-X9QP: fill it in and look it up.
  const fromUrl = new URLSearchParams(location.search).get('id');
  input.value = fromUrl || AuroraTrack.recall();
  if (fromUrl) form.requestSubmit();
}
startTrackPage();
</script>
</body></html>
